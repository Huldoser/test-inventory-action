name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # actionlint checks the workflow syntax and the shell in each step; zizmor checks them for security problems.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint's release binary, checked against its checksum, and not its Docker image: GitHub's allow list of
      # actions can't name an image. actionlint runs the runner's shellcheck over each run step.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          release="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL -o actionlint.tar.gz "$release/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Coverage is measured once, on Linux.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm test

  lint:
    name: Lint, format and dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      # The action runs the committed dist/, so it must be what the sources build.
      - run: npm run build
      - run: git diff --exit-code -- dist

  # The action itself, from this checkout, on this pull request, on each runner OS.
  action:
    name: Action (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 doesn't know GitHub's `$/` self-repository syntax yet, so this stays `./`:
      # https://github.com/rhysd/actionlint/issues/711
      - id: tests
        uses: ./ # zizmor: ignore[self-repository]
      - name: Check the outputs
        shell: bash
        env:
          REPORT_DIR: ${{ steps.tests.outputs.report-dir }}
        run: test -s "$REPORT_DIR/report.json"

  # The one check the branch ruleset requires, so the ruleset stays the same when jobs change. List every other job
  # in `needs`.
  ci:
    if: always()
    needs: [workflows, test, lint, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list the jobs of this run
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # needs.<job>.result is success for a matrix job when GitHub cancels one of its legs because no runner took it,
      # so every job of this run attempt, each matrix leg included, must also have succeeded or been skipped.
      - name: Check every job of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          gh api --paginate "$jobs" |
            jq -r '.jobs[]
              | select(.name != "ci")
              | select(.conclusion != "success" and .conclusion != "skipped")
              | "\(.name): \(.conclusion // .status)"' > not-passed.txt
          if [ -s not-passed.txt ]; then
            while read -r job; do echo "::error::Not passed: $job"; done < not-passed.txt
            exit 1
          fi
